services:
  backend:
    build: ./backend
    ports: ["8082:8080"]
    volumes: ["./backend:/app"]
    environment: ["ENV=development", "PORT=8080"]
    command: go run main.go
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    environment:
      - VITE_API_URL=http://localhost:8082
      - VITE_PROXY_TARGET=http://backend:8080
    depends_on: ["backend"]
